server:
  port: ${PORT:3000}
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  application:
    name: quickdevbase
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      idle-timeout: 30000
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
